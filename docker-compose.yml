# Postgres local pour le développement.
# Le serveur Next tourne nativement sur l'hôte (`yarn dev`) : conteneuriser le
# dev server sur macOS coûte cher en I/O de bind-mount et fait diverger
# node_modules entre l'hôte et le conteneur, pour aucun bénéfice ici.
#
#   yarn db:up      démarre la base
#   yarn db:reset   remet la base à zéro (supprime le volume)

services:
  db:
    image: postgres:17-alpine
    container_name: mesrecettes-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mesrecettes
      POSTGRES_PASSWORD: mesrecettes
      POSTGRES_DB: mesrecettes
      TZ: Europe/Paris
      PGTZ: Europe/Paris
    ports:
      # 5433 côté hôte pour ne pas entrer en conflit avec un Postgres déjà installé.
      - "5433:5432"
    volumes:
      - mesrecettes-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mesrecettes -d mesrecettes"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Interface web d'inspection, optionnelle :
  #   docker compose --profile tools up -d   →   http://localhost:8080
  adminer:
    image: adminer:5
    container_name: mesrecettes-adminer
    profiles: ["tools"]
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  mesrecettes-pgdata:
